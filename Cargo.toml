[workspace]
resolver = "3"
members = ["crates/*", "fixtures/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/project-blinc/russl"
authors = ["Damilare Akinlaja <dreakinlaja@gmail.com>"]

[workspace.dependencies]
russl_compiler = { path = "crates/russl_compiler", version = "0.2.0" }
russl_macros = { path = "crates/russl_macros", version = "0.2.0" }
russl_expand = { path = "crates/russl_expand", version = "0.2.0" }
russl = { path = "crates/russl", version = "0.2.0" }
# The naga minor version Blinc's wgpu uses; bumped together.
naga = { version = "~26.0", features = ["wgsl-in", "wgsl-out", "msl-out", "hlsl-out", "spv-out", "glsl-out"] }
# Span::file, which names the file a span is in.
proc-macro2 = "1.0.95"
quote = "1"
syn = { version = "2", features = ["full"] }
