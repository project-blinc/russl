[package]
name = "russl_compiler"
description = "The russl compiler: Rust-syntax shader source to naga, validated, emitted per target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["shader", "wgsl", "naga", "compiler"]
categories = ["graphics", "rendering", "compilers"]

[dependencies]
naga.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn.workspace = true
quote.workspace = true
# The f16 literals naga takes; the version naga 26 uses.
half = { version = "2.5", default-features = false }
ariadne = { version = "0.6", optional = true }

[features]
# Diagnostics rendered with source snippets, for tools that have the source text.
ariadne = ["dep:ariadne"]


[dev-dependencies]
# Tests parse the WGSL output back.
naga = { workspace = true, features = ["wgsl-in"] }
