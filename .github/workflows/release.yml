name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.3.0); the tag v<version> must exist'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - name: Read the version from the tag and check it against the workspace
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$crate" ]; then
            echo "the tag says $version, Cargo.toml says $crate" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  # The `russl` command.
  cli:
    name: CLI ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the Linux ARM64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }} -p russl_cli
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name=russl-${{ needs.version.outputs.tag }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/russl LICENSE README.md "$name"/
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip "$name/russl" || true
          else
            strip "$name/russl" || true
          fi
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "russl-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/russl.exe, LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: russl-${{ matrix.target }}
          path: ${{ env.ASSET }}

  # The toy: a Blinc app, so only where Blinc builds.
  toy:
    name: Toy ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: toy
          key: ${{ matrix.target }}
      - name: Install the Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev libfontconfig1-dev \
            fonts-dejavu-core libglib2.0-dev libatk1.0-dev libgtk-3-dev libdbus-1-dev \
            libxdo-dev libasound2-dev
      - run: cargo build --release --target ${{ matrix.target }} --manifest-path toy/Cargo.toml
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name=russl-toy-${{ needs.version.outputs.tag }}-${{ matrix.target }}
          mkdir "$name"
          cp toy/target/${{ matrix.target }}/release/russl-toy LICENSE toy/assets/JetBrainsMono-OFL.txt "$name"/
          strip "$name/russl-toy" || true
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "russl-toy-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item toy/target/${{ matrix.target }}/release/russl-toy.exe, LICENSE, toy/assets/JetBrainsMono-OFL.txt $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: russl-toy-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    name: Create release
    needs: [version, cli, toy]
    # The command is the release; a toy that fails to build is reported, not fatal.
    if: ${{ !cancelled() && needs.cli.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: russl ${{ needs.version.outputs.version }}
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          body: |
            ## The `russl` command

            `russl check shader.russl --deny-warnings` and `russl emit shader.russl msl`
            (or `wgsl`, `hlsl`, `glsl`, `spirv`). Download the archive for your platform,
            extract it and put `russl` on your `PATH`; or `cargo install russl_cli`.

            | platform | archive |
            |---|---|
            | macOS, Apple Silicon | `russl-${{ needs.version.outputs.tag }}-aarch64-apple-darwin.tar.gz` |
            | macOS, Intel | `russl-${{ needs.version.outputs.tag }}-x86_64-apple-darwin.tar.gz` |
            | Linux, x86_64 | `russl-${{ needs.version.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux, ARM64 | `russl-${{ needs.version.outputs.tag }}-aarch64-unknown-linux-gnu.tar.gz` |
            | Windows | `russl-${{ needs.version.outputs.tag }}-x86_64-pc-windows-msvc.zip` |

            ## The toy

            `russl-toy` is a live shader playground built with Blinc: write russl and watch it
            draw. The `russl-toy-*` archives are for macOS (Apple Silicon), Linux (x86_64) and
            Windows (x86_64).

            `SHA256SUMS.txt` lists the checksum of every archive.
